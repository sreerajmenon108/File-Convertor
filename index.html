      const SLIDER_ANCHORS=[
        {position:0,kb:100},
        {position:333.33,kb:1024},
        {position:666.67,kb:5120},
        {position:1000,kb:10240}
      ];

      function sliderToKb(position){
        const p=Math.max(0,Math.min(1000,Number(position)));
        for(let i=0;i<SLIDER_ANCHORS.length-1;i++){
          const a=SLIDER_ANCHORS[i],b=SLIDER_ANCHORS[i+1];
          if(p>=a.position&&p<=b.position){
            const t=(p-a.position)/(b.position-a.position);
            return Math.round(a.kb+t*(b.kb-a.kb));
          }
        }
        return 1024;
      }

      function kbToSlider(kb){
        const k=Math.max(100,Math.min(10240,Number(kb)));
        for(let i=0;i<SLIDER_ANCHORS.length-1;i++){
          const a=SLIDER_ANCHORS[i],b=SLIDER_ANCHORS[i+1];
          if(k>=a.kb&&k<=b.kb){
            const t=(k-a.kb)/(b.kb-a.kb);
            return Math.round(a.position+t*(b.position-a.position));
          }
        }
        return 333;
      }

      async function enhanceDocumentDataUrl(croppedDataUrl){
        const img=await loadImageElement(croppedDataUrl);
        const w=img.naturalWidth,h=img.naturalHeight;
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
        const imgData=ctx.getImageData(0,0,w,h),data=imgData.data;
        const dsScale=Math.min(1,320/Math.max(w,h));
        const dw=Math.max(16,Math.round(w*dsScale)),dh=Math.max(16,Math.round(h*dsScale));
        const lumSmall=new Float32Array(dw*dh);
        for(let y=0;y<dh;y++){
          const srcY=Math.min(h-1,Math.floor(y/dsScale));
          for(let x=0;x<dw;x++){
            const srcX=Math.min(w-1,Math.floor(x/dsScale));
            const idx=(srcY*w+srcX)*4;
            lumSmall[y*dw+x]=0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2];
          }
        }
        const dilateRadius=Math.max(3,Math.round(Math.min(dw,dh)*0.025));
        const dilated=morphologicalMax2D(lumSmall,dw,dh,dilateRadius);
        const blurRadius=Math.max(6,Math.round(Math.min(dw,dh)*0.06));
        const bgMap=boxBlur2D(boxBlur2D(dilated,dw,dh,blurRadius),dw,dh,blurRadius);
        for(let y=0;y<h;y++){
          const fy=(y/h)*(dh-1),y0=Math.floor(fy),y1=Math.min(dh-1,y0+1),wy=fy-y0;
          for(let x=0;x<w;x++){
            const fx=(x/w)*(dw-1),x0=Math.floor(fx),x1=Math.min(dw-1,x0+1),wx=fx-x0;
            const top=bgMap[y0*dw+x0]*(1-wx)+bgMap[y0*dw+x1]*wx;
            const bot=bgMap[y1*dw+x0]*(1-wx)+bgMap[y1*dw+x1]*wx;
            const localBg=Math.max(45,top*(1-wy)+bot*wy);
            const idx=(y*w+x)*4,gain=252.0/localBg;
            data[idx]=applyDocumentToneCurve(data[idx]*gain);
            data[idx+1]=applyDocumentToneCurve(data[idx+1]*gain);
            data[idx+2]=applyDocumentToneCurve(data[idx+2]*gain);
          }
        }
        imgData.data.set(applyUnsharpMask(data,w,h,0.38));
        ctx.putImageData(imgData,0,0);
        return canvas.toDataURL('image/jpeg',0.94);
      }

      function applyDocumentToneCurve(val){
        if(val>=255)return 255;if(val<=0)return 0;
        if(val>212){const t=(val-212)/43;return Math.min(255,Math.round(212+Math.pow(t,0.65)*43))}
        if(val<140){const t=val/140;return Math.max(0,Math.round(Math.pow(t,1.12)*140))}
        return Math.round(val);
      }

      function morphologicalMax2D(src,w,h,radius){
        const temp=new Float32Array(w*h),dst=new Float32Array(w*h);
        for(let y=0;y<h;y++){
          const rowOff=y*w;
          for(let x=0;x<w;x++){
            let maxVal=0;
            for(let kx=Math.max(0,x-radius);kx<=Math.min(w-1,x+radius);kx++){const v=src[rowOff+kx];if(v>maxVal)maxVal=v}
            temp[rowOff+x]=maxVal;
          }
        }
        for(let x=0;x<w;x++){
          for(let y=0;y<h;y++){
            let maxVal=0;
            for(let ky=Math.max(0,y-radius);ky<=Math.min(h-1,y+radius);ky++){const v=temp[ky*w+x];if(v>maxVal)maxVal=v}
            dst[y*w+x]=maxVal;
          }
        }
        return dst;
      }

      function boxBlur2D(src,w,h,radius){
        const temp=new Float32Array(w*h),dst=new Float32Array(w*h);
        for(let y=0;y<h;y++){
          const rowOff=y*w;let sum=0,count=0;
          for(let kx=0;kx<=Math.min(w-1,radius);kx++){sum+=src[rowOff+kx];count++}
          for(let x=0;x<w;x++){
            temp[rowOff+x]=sum/count;
            const addIdx=x+radius+1,remIdx=x-radius;
            if(addIdx<w){sum+=src[rowOff+addIdx];count++}
            if(remIdx>=0){sum-=src[rowOff+remIdx];count--}
          }
        }
        for(let x=0;x<w;x++){
          let sum=0,count=0;
          for(let ky=0;ky<=Math.min(h-1,radius);ky++){sum+=temp[ky*w+x];count++}
          for(let y=0;y<h;y++){
            dst[y*w+x]=sum/count;
            const addIdx=y+radius+1,remIdx=y-radius;
            if(addIdx<h){sum+=temp[addIdx*w+x];count++}
            if(remIdx>=0){sum-=temp[remIdx*w+x];count--}
          }
        }
        return dst;
      }

      function applyUnsharpMask(rgba,w,h,amount){
        const out=new Uint8ClampedArray(rgba.length);out.set(rgba);
        for(let y=1;y<h-1;y++){
          for(let x=1;x<w-1;x++){
            const idx=(y*w+x)*4;
            for(let c=0;c<3;c++){
              const center=rgba[idx+c];
              const blur=(rgba[((y-1)*w+x)*4+c]+rgba[((y+1)*w+x)*4+c]+rgba[(y*w+(x-1))*4+c]+rgba[(y*w+(x+1))*4+c])*0.25;
              const diff=center-blur;
              if(Math.abs(diff)>6)out[idx+c]=Math.max(0,Math.min(255,Math.round(center+diff*amount)));
            }
          }
        }
        return out;
      }

      async function getEnhancedDataUrlForPage(index){

      window.setTargetSizeKB=function(kb,activateStep3=true){
        kb=Math.max(100,Math.min(10240,Math.round(kb)));

        invalidateGeneratedPdf();
        document.querySelectorAll('.size-preset-btn').forEach(btn=>{
          const btnKB=parseInt(btn.dataset.kb,10);
          if(btnKB===kb){btn.classList.add('bg-brand-600','text-white','border-brand-600');btn.classList.remove('border-slate-200','text-slate-700')}
          else{btn.classList.remove('bg-brand-600','text-white','border-brand-600');btn.classList.add('border-slate-200','text-slate-700')}
        });
        document.getElementById('targetSizeSlider').value=kbToSlider(kb);
        const unitSelect=document.getElementById('customSizeUnit'),numInput=document.getElementById('customSizeNumber');
        if(kb>=1024&&kb%1024===0){unitSelect.value='MB';numInput.value=kb/1024;numInput.min=0.1;numInput.max=10;numInput.step=0.1}
        else if(unitSelect.value==='MB'){numInput.value=(kb/1024).toFixed(2)}
        else{unitSelect.value='KB';numInput.value=kb;numInput.min=100;numInput.max=10240;numInput.step=10}
        const displayStr=kb>=1024?`${(kb/1024).toFixed(2)} MB (${kb.toLocaleString()} KB)`:`${kb} KB`;
        document.getElementById('formattedTargetDisplay').textContent=displayStr;

      };

        const kb=sliderToKb(sliderVal);

      window.handleManualUnitChange=function(){
        setActiveStep(3);

        if(unit==='MB'){numInput.min=0.1;numInput.max=10;numInput.step=0.1;numInput.value=Math.max(0.1,Math.min(10,(targetSizeKB/1024))).toFixed(2)}
        else{numInput.min=100;numInput.max=10240;numInput.step=10;numInput.value=targetSizeKB}

      window.handleManualNumberInput=function(){
        setActiveStep(3);

        if(isNaN(val))return;

        const displayStr=targetSizeKB>=1024?`${(targetSizeKB/1024).toFixed(2)} MB (${targetSizeKB.toLocaleString()} KB)`:`${targetSizeKB} KB`;
        document.getElementById('formattedTargetDisplay').textContent=displayStr;
        document.getElementById('targetSizeSlider').value=kbToSlider(targetSizeKB);

      function updateCompressionGuidance(){
        const count=Math.max(1,pages.length),kbPerPage=Math.round(targetSizeKB/count);
        const box=document.getElementById('compressionGuidanceBox'),text=document.getElementById('compressionGuidanceText');
        if(kbPerPage<35){
          box.className='rounded-2xl p-3.5 text-xs mb-4 bg-amber-50 text-amber-900 border border-amber-200 flex items-start gap-2.5';
          text.innerHTML=`<strong>High Compression (~${kbPerPage} KB/page):</strong> Fitting ${count} pages into ${formatBytes(targetSizeKB*1024)} requires aggressive downscaling. Fine text may look softer.`;
        }else if(kbPerPage<150){
          box.className='rounded-2xl p-3.5 text-xs mb-4 bg-blue-50 text-blue-800 border border-blue-200 flex items-start gap-2.5';
          text.innerHTML=`<strong>Compact Web Quality (~${kbPerPage} KB/page):</strong> Ideal for email attachments and portals while keeping documents legible.`;
        }else{
          box.className='rounded-2xl p-3.5 text-xs mb-4 bg-emerald-50 text-emerald-800 border border-emerald-200 flex items-start gap-2.5';
          text.innerHTML=`<strong>High Clarity (~${kbPerPage} KB/page):</strong> Plenty of size budget for sharp, high-resolution pages.`;
        }
      }

      window.invalidateGeneratedPdf=function(){
        if(generatedPdfUrl){URL.revokeObjectURL(generatedPdfUrl);generatedPdfUrl=null}
        generatedPdfBlob=null;
        document.getElementById('pdfResultCard').classList.add('hidden');
      };

      function loadImageElement(dataUrl){
        return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=dataUrl});
      }

      function compressImageToJpeg(img,scale,quality){
        const targetW=Math.max(120,Math.round(img.naturalWidth*scale)),targetH=Math.max(120,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement('canvas');canvas.width=targetW;canvas.height=targetH;
        const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,targetW,targetH);
        ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,targetW,targetH);
        return{dataUrl:canvas.toDataURL('image/jpeg',quality),width:targetW,height:targetH};
      }

      function buildPdfBlobFromImages(compressedImages,pageFormatMode){
        const{jsPDF}=window.jspdf;let doc=null;
        compressedImages.forEach((item,index)=>{
          const isLandscape=item.width>item.height;
          if(pageFormatMode==='match-image'){
            const ptW=item.width*0.75,ptH=item.height*0.75,orientation=ptW>ptH?'l':'p';
            if(index===0)doc=new jsPDF({orientation,unit:'pt',format:[ptW,ptH],compress:true});
            else doc.addPage([ptW,ptH],orientation);
            doc.addImage(item.dataUrl,'JPEG',0,0,ptW,ptH,undefined,'FAST');
          }else{
            const orientation=(pageFormatMode==='a4-fit'&&isLandscape)?'l':'p';
            if(index===0)doc=new jsPDF({orientation,unit:'pt',format:'a4',compress:true});
            else doc.addPage('a4',orientation);
            const pageWidth=doc.internal.pageSize.getWidth(),pageHeight=doc.internal.pageSize.getHeight();
            const margin=20,maxW=pageWidth-margin*2,maxH=pageHeight-margin*2;
            const imgRatio=item.width/item.height,boxRatio=maxW/maxH;
            let drawW,drawH;
            if(imgRatio>boxRatio){drawW=maxW;drawH=maxW/imgRatio}else{drawH=maxH;drawW=maxH*imgRatio}
            doc.addImage(item.dataUrl,'JPEG',(pageWidth-drawW)/2,(pageHeight-drawH)/2,drawW,drawH,undefined,'FAST');
          }
        });
        return doc.output('blob');
      }

      window.generateCompressedPDF=async function(mode=selectedPdfMode){
        if(pages.length===0){showToast('Please add and crop at least one image first.','error');return}
        selectPdfMode(mode);setActiveStep(3);
        const stdBtn=document.getElementById('createStandardPdfBtn'),enhBtn=document.getElementById('createEnhancedPdfBtn');
        const progressContainer=document.getElementById('progressContainer'),progressBarFill=document.getElementById('progressBarFill');
        const progressStatusLabel=document.getElementById('progressStatusLabel'),progressPercentLabel=document.getElementById('progressPercentLabel');
        stdBtn.disabled=true;enhBtn.disabled=true;progressContainer.classList.remove('hidden');
        document.getElementById('pdfResultCard').classList.add('hidden');
        const updateProgress=(pct,label)=>{progressBarFill.style.width=`${pct}%`;progressPercentLabel.textContent=`${pct}%`;progressStatusLabel.textContent=label};
        try{
          const sourceUrls=[];
          if(mode==='enhanced'){
            for(let i=0;i<pages.length;i++){
              updateProgress(Math.round(((i+1)/pages.length)*28),`Removing shadows & enhancing Page ${i+1}/${pages.length}...`);
              await new Promise(r=>setTimeout(r,15));
              sourceUrls.push(await getEnhancedDataUrlForPage(i));
            }
          }else{
            updateProgress(15,'Loading cropped pages...');
            await new Promise(r=>setTimeout(r,20));
            pages.forEach(p=>sourceUrls.push(p.croppedDataUrl));
          }
          const loadedImages=await Promise.all(sourceUrls.map(url=>loadImageElement(url)));
          const pageFormatMode=document.getElementById('pdfPageFormat').value,targetBytes=targetSizeKB*1024;
          updateProgress(35,'Testing full-resolution PDF size...');
          await new Promise(r=>setTimeout(r,20));
          let bestBlob=buildPdfBlobFromImages(loadedImages.map(img=>compressImageToJpeg(img,1.0,0.92)),pageFormatMode);
          if(bestBlob.size<=targetBytes){updateProgress(100,'Optimal quality achieved!')}
          else{
            let low=0.02,high=0.98,candidateUnderTarget=null;const maxIterations=7;
            for(let iter=1;iter<=maxIterations;iter++){
              const mid=(low+high)/2,scale=Math.min(1.0,Math.max(0.18,0.18+mid*0.82)),quality=Math.min(0.92,Math.max(0.12,0.12+mid*0.80));
              updateProgress(35+Math.round((iter/maxIterations)*60),`Optimizing size (Pass ${iter}/${maxIterations})...`);
              await new Promise(r=>setTimeout(r,15));
              const attemptBlob=buildPdfBlobFromImages(loadedImages.map(img=>compressImageToJpeg(img,scale,quality)),pageFormatMode);
              if(attemptBlob.size<=targetBytes){candidateUnderTarget=attemptBlob;low=mid}else{high=mid}
            }
            if(candidateUnderTarget)bestBlob=candidateUnderTarget;
            else{updateProgress(96,'Applying maximum compression...');bestBlob=buildPdfBlobFromImages(loadedImages.map(img=>compressImageToJpeg(img,0.15,0.12)),pageFormatMode)}
            updateProgress(100,'Compression complete!');
          }
          invalidateGeneratedPdf();
          generatedPdfBlob=bestBlob;generatedPdfUrl=URL.createObjectURL(bestBlob);
          const finalSizeStr=formatBytes(bestBlob.size),targetSizeStr=formatBytes(targetBytes),modeLabel=mode==='enhanced'?'Enhanced Document Scan':'Standard PDF';
          document.getElementById('pdfResultModeBadge').textContent=modeLabel;
          document.getElementById('pdfResultStats').textContent=`Final Size: ${finalSizeStr} (Target Limit: ${targetSizeStr}) \u2022 ${pages.length} ${pages.length===1?'Page':'Pages'}`;
          document.getElementById('pdfResultCard').classList.remove('hidden');
          showToast(`${modeLabel} created (${finalSizeStr})!`,'success');
        }catch(err){console.error(err);showToast('An error occurred while generating the PDF.','error')}
        finally{stdBtn.disabled=false;enhBtn.disabled=false;setTimeout(()=>progressContainer.classList.add('hidden'),900)}
      };

      function getSanitizedFilename(){
        const raw=document.getElementById('pdfFilename').value.trim()||'Consolidated_Document';
        const suffix=selectedPdfMode==='enhanced'?'_Enhanced':'';
        return raw.replace(/[^a-zA-Z0-9_\- ]/g,'_')+suffix+'.pdf';
      }

      window.triggerPdfDownload=function(){
        if(!generatedPdfUrl)return;
        const a=document.createElement('a');a.href=generatedPdfUrl;a.download=getSanitizedFilename();
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      };

      window.openPdfViewerModal=function(){
        if(!generatedPdfUrl)return;
        document.getElementById('pdfViewerTitle').textContent=getSanitizedFilename();
        document.getElementById('pdfViewerSizeBadge').textContent=generatedPdfBlob?formatBytes(generatedPdfBlob.size):'';
        document.getElementById('pdfPreviewIframe').src=generatedPdfUrl;
        document.getElementById('pdfViewerModal').classList.remove('hidden');
      };

      window.closePdfViewerModal=function(){
        document.getElementById('pdfViewerModal').classList.add('hidden');
        document.getElementById('pdfPreviewIframe').src='';
      };

      function formatBytes(bytes){
        if(bytes<1024)return bytes+' B';
        const kb=bytes/1024;
        if(kb<1024)return kb.toFixed(1)+' KB';
        return(kb/1024).toFixed(2)+' MB';
      }

      window.showToast=function(message,type='info'){
        const container=document.getElementById('toastContainer'),toast=document.createElement('div');
        const colors={success:'bg-slate-900 text-white border-emerald-500',error:'bg-rose-900 text-white border-rose-400',info:'bg-slate-800 text-white border-brand-400'};
        toast.className=`pointer-events-auto px-4 py-3 rounded-xl shadow-lg border-l-4 text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-0 ${colors[type]||colors.info}`;
        toast.textContent=message;container.appendChild(toast);
        setTimeout(()=>{toast.classList.add('opacity-0','translate-y-2');setTimeout(()=>toast.remove(),300)},3000);
      };

      setTargetSizeKB(1024,false);
      setActiveStep(1);
    })();
  </script>
